name: E2E (live sites)

# Live-site tests authenticate against real external services and require
# credentials.  Run on main-branch pushes, manual dispatch, and on a weekly
# schedule to catch upstream auth/flow breakage early.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      site:
        description: "Which site(s) to test"
        type: choice
        options: [all, garmin, rouvy]
        default: all
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    environment: e2e
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      ROUVY_EMAIL: ${{ secrets.ROUVY_EMAIL }}
      ROUVY_PASSWORD: ${{ secrets.ROUVY_PASSWORD }}
      WEB_AUTH_BRIDGE_E2E_HEADLESS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run playwright install --with-deps chromium

      - name: Resolve marker expression
        id: marker
        run: |
          case "${{ inputs.site || 'all' }}" in
            garmin) echo "expr=e2e and garmin" >> "$GITHUB_OUTPUT" ;;
            rouvy)  echo "expr=e2e and rouvy"  >> "$GITHUB_OUTPUT" ;;
            *)      echo "expr=e2e"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run e2e tests
        run: uv run pytest -m "${{ steps.marker.outputs.expr }}" -v --junitxml=junit-e2e.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: junit-e2e.xml
          check_name: E2E tests
          include_passed: true
          detailed_summary: true
          require_tests: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: junit-e2e.xml
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
